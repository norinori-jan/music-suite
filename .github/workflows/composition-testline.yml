name: Composition Test Line

on:
  push:
    paths:
      - "apps/composition-canvas.html"
      - "apps/beat-lab.html"
      - "tests/**"
      - ".github/workflows/composition-testline.yml"
  pull_request:
    paths:
      - "apps/composition-canvas.html"
      - "apps/beat-lab.html"
      - "tests/**"
      - ".github/workflows/composition-testline.yml"
  workflow_dispatch:

jobs:
  composition-testline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CC0 sample importer syntax
        run: node --check scripts/import-cc0-drums.mjs
      - name: Run composition regression tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke test
        run: node tests/browser-smoke.mjs
