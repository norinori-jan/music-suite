name: Composition Test Line

on:
  push:
    paths:
      - "apps/composition-canvas.html"
      - "apps/beat-lab.html"
      - "tests/**"
      - "audio/**"
      - "scripts/**"
      - ".github/workflows/composition-testline.yml"
  pull_request:
    paths:
      - "apps/composition-canvas.html"
      - "apps/beat-lab.html"
      - "tests/**"
      - ".github/workflows/composition-testline.yml"
  workflow_dispatch:

jobs:
  composition-testline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run composition regression tests including imported asset integrity
        run: node --check scripts/import-meta-open-sound.mjs && node --check scripts/compare-ogg-wav.mjs && node --check scripts/import-cc0-rhythm.mjs && node scripts/import-cc0-rhythm.mjs --dry-run && node --check sw.js && node scripts/import-meta-open-sound.mjs --dry-run && node --test tests/composition-testline.test.mjs tests/composition-multitrack.test.mjs tests/conversation-composition.test.mjs tests/sample-engine.test.mjs tests/pwa-offline.test.mjs
