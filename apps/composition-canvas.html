<script>

const state = { audioCtx: null };

/* ───────────────────────────────
   YIN ピッチ検出
────────────────────────────── */
function yinPitchDetect(buffer, sampleRate) {
  const threshold = 0.1;
  const yin = new Float32Array(buffer.length / 2);

  for (let tau = 1; tau < yin.length; tau++) {
    let sum = 0;
    for (let i = 0; i < yin.length; i++) {
      const delta = buffer[i] - buffer[i + tau];
      sum += delta * delta;
    }
    yin[tau] = sum;
  }

  let runningSum = 0;
  for (let tau = 1; tau < yin.length; tau++) {
    runningSum += yin[tau];
    yin[tau] *= tau / runningSum;
  }

  for (let tau = 2; tau < yin.length; tau++) {
    if (yin[tau] < threshold) {
      return sampleRate / tau;
    }
  }

  return null;
}

/* ───────────────────────────────
   メロディ抽出（YIN）
────────────────────────────── */
async function extractMelody(audioBuf) {
  const sampleRate = audioBuf.sampleRate;
  const data = audioBuf.getChannelData(0);

  const frameSize = Math.floor(sampleRate * 0.03);
  const hopSize = Math.floor(frameSize / 2);

  const pitches = [];

  for (let start = 0; start + frameSize < data.length; start += hopSize) {
    const frame = data.slice(start, start + frameSize);
    const pitch = yinPitchDetect(frame, sampleRate);

    if (pitch && pitch > 150 && pitch < 1200) {
      pitches.push(pitch);
    } else {
      pitches.push(null);
    }
  }

  return pitches;
}

/* ───────────────────────────────
   ピッチ → 音名変換（B）
────────────────────────────── */
function pitchToNoteName(pitch) {
  if (!pitch) return null;

  const noteNumber = 12 * (Math.log2(pitch / 440)) + 69;
  const midi = Math.round(noteNumber);

  const names = [
    "C", "C#", "D", "D#", "E", "F",
    "F#", "G", "G#", "A", "A#", "B"
  ];

  const name = names[midi % 12];
  const octave = Math.floor(midi / 12) - 1;

  return `${name}${octave}`;
}

function convertPitchesToNotes(pitches) {
  return pitches.map(p => pitchToNoteName(p));
}
function noteToMidi(note) {
  const table = {
    C:0,"C#":1,
    D:2,"D#":3,
    E:4,
    F:5,"F#":6,
    G:7,"G#":8,
    A:9,"A#":10,
    B:11
  };

  const m = note.match(
    /^([A-G]#?)(-?\d+)$/
  );

  return table[m[1]]
       + (parseInt(m[2]) + 1) * 12;
}
function noteDistance(a, b) {
  if (!a || !b) return 999;

  const table = {
    C:0,
    "C#":1,
    D:2,
    "D#":3,
    E:4,
    F:5,
    "F#":6,
    G:7,
    "G#":8,
    A:9,
    "A#":10,
    B:11
  };

  const parse = (n) => {
    const m = n.match(/^([A-G]#?)(-?\d+)$/);
    return table[m[1]] + parseInt(m[2]) * 12;
  };

  return Math.abs(parse(a) - parse(b));
}
/* ───────────────────────────────
   クラウド同期(sync-worker /attachments/music-suite)
   music-suiteのindex.htmlで設定したエンドポイント/トークンをそのまま使う
────────────────────────────── */
const CLOUD_ENDPOINT_KEY = 'msuite_sync_endpoint';
const CLOUD_TOKEN_KEY = 'msuite_sync_token';

function getCloudConfig() {
  return {
    endpoint: (localStorage.getItem(CLOUD_ENDPOINT_KEY) || '').replace(/\/$/, ''),
    token: localStorage.getItem(CLOUD_TOKEN_KEY) || ''
  };
}

async function uploadCurrentAudioToCloud() {
  if (!state.lastFile) {
    showToast('先に🎧音源解析で曲を読み込んでください');
    return;
  }
  const { endpoint, token } = getCloudConfig();
  if (!endpoint || !token) {
    alert('music-suiteのトップページ(index.html)で先に「☁️ クラウド同期」のエンドポイント/トークンを設定してください');
    return;
  }
  showToast('アップロード中…');
  try {
    const id = 'audio-' + Date.now();
    const buf = await state.lastFile.arrayBuffer();
    const res = await fetch(`${endpoint}/attachments/music-suite/${id}`, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${token}`,
        'X-Item-Id': id,
        'X-Mime-Type': state.lastFile.type || 'audio/mpeg',
        'X-File-Name': encodeURIComponent(state.lastFile.name),
        'X-Updated-At': String(Date.now())
      },
      body: buf
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    showToast(`「${state.lastFile.name}」をクラウドにアップロードしました`);
  } catch (e) {
    console.error(e);
    showToast('アップロードに失敗しました: ' + e.message);
  }
}

async function listCloudAudio() {
  const { endpoint, token } = getCloudConfig();
  if (!endpoint || !token) {
    alert('先にmusic-suiteのトップページでクラウド同期を設定してください');
    return [];
  }
  const res = await fetch(`${endpoint}/attachments/music-suite`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) return [];
  const data = await res.json();
  return (data.attachments || []).filter(a => (a.mimeType || '').startsWith('audio'));
}

async function openAudioFromCloud() {
  try {
    const list = await listCloudAudio();
    if (!list.length) {
      showToast('クラウドに音源がありません。PC側で先にアップロードしてください');
      return;
    }
    const menu = list
      .map((a, i) => `${i + 1}: ${a.name || a.id} (${new Date(a.updatedAt).toLocaleString('ja-JP')})`)
      .join('\n');
    const choice = prompt(`読み込む番号を入力してください:\n${menu}`, '1');
    const idx = parseInt(choice, 10) - 1;
    if (isNaN(idx) || !list[idx]) return;

    showToast('ダウンロード中…');
    const { endpoint, token } = getCloudConfig();
    const res = await fetch(`${endpoint}/attachments/music-suite/${list[idx].id}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const arrayBuf = await res.arrayBuffer();
    const name = decodeURIComponent(res.headers.get('X-File-Name') || list[idx].name || 'cloud-audio');
    await analyzeAudioBuffer(arrayBuf, name);
  } catch (e) {
    console.error(e);
    showToast('クラウドからの読み込みに失敗しました: ' + e.message);
  }
}

/* ───────────────────────────────
   音源解析 → A+B+C + セグメント化
────────────────────────────── */
async function analyzeAudioFile(file) {
  state.lastFile = file;
  const arrayBuf = await file.arrayBuffer();
  await analyzeAudioBuffer(arrayBuf, file.name);
}

async function analyzeAudioBuffer(arrayBuf, displayName) {
  try {
    if (!state.audioCtx) {
      state.audioCtx =
        new (window.AudioContext || window.webkitAudioContext)();
    }

    const audioBuf =
      await state.audioCtx.decodeAudioData(arrayBuf);

    showToast("メロディ抽出中…");

    // A：ピッチ抽出
    const pitches = await extractMelody(audioBuf);
    console.log("pitches:", pitches);

    // B：音名変換
    const notes = convertPitchesToNotes(pitches);
    console.log("notes:", notes);

    // ★追加：連続音を統合
    const segments = segmentNotes(notes);
    console.log("segments:", segments);

    // 保存(sendToScoreEditor()は{note, length}形式を期待するのでsegmentsを入れる)
    state.lastNotes = segments;
    state.lastSegments = segments;

    // C：カード表示
    renderNoteCards(segments, displayName);
    // 音声解析時の従来の出力処理はここで明示的に実行する。
    exportMelodyLog(segments, displayName);
    exportMelodyToSheet(segments, displayName);

    showToast(
      `${notes.length}フレーム → ${segments.length}音に統合(${displayName || ''})`
    );

  } catch (e) {
    console.error(e);
    showToast("音源の解析に失敗しました");
  }
}

/* ───────────────────────────────
   連続音の統合（セグメント化）
────────────────────────────── */
function segmentNotes(notes) {
  const result = [];

  let current = null;
  let count = 0;

  for (const note of notes) {

    if (!note) continue;

    // 同音または半音以内なら同じ音として扱う
    if (
      current !== null &&
      noteDistance(note, current) <= 1
    ) {
      count++;

    } else {

      if (current !== null) {
        result.push({
          note: current,
          length: count
        });
      }

      current = note;
      count = 1;
    }
  }

  if (current !== null) {
    result.push({
      note: current,
      length: count
    });
  }

  console.log(
    "segment:",
    notes.length,
    "→",
    result.length
  );

  return result;
}

function escapeHtmlCanvas(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function applyLyricsToCanvas(){
  const sections=lyricSectionsRead();

  const weights=lines.map(line=>Math.max(1,(line.text.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).length));
  const total=weights.reduce((x,y)=>x+y,0);let cursor=0;

    const count=index===lines.length-1?remainCards:Math.min(remainCards-(remainLines-1),Math.max(1,Math.round(cards.length*weights[index]/total)));

    for(let i=cursor;i<cursor+count;i++){

function lyricEstimateSyllables(word){
  const w=String(word||'').toLowerCase().replace(/[^a-z']/g,'');
  if(!w)return 1;
  if(w.length<=3)return 1;
  const groups=w.match(/[aeiouy]+/g)||[];
  let n=Math.max(1,groups.length);
  if(/e$/.test(w)&&!/(le|ye)$/.test(w)&&n>1)n--;
  return n;
}
const LYRIC_NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LYRIC_SCALES={C:[0,2,4,5,7,9,11],G:[0,2,4,5,7,9,11],D:[0,2,4,5,7,9,11],A:[0,2,3,5,7,8,10],E:[0,2,3,5,7,8,10]};
const LYRIC_ROOTS={C:0,G:7,D:2,A:9,E:4};
const LYRIC_PROGRESSIONS={pop:[1,5,6,4],warm:[1,6,4,5],sad:[6,4,1,5],simple:[1,4,5,1],rock:[1,4,6,5],jazz:[2,5,1,6],rb:[1,3,6,2],cinematic:[6,4,1,5],loop:[1,5,6,3],surprise:[1,3,4,4]};
function buildDiatonicTriad(key,degree){
  const scale=LYRIC_SCALES[key],root=LYRIC_ROOTS[key];
  if(!scale||!Number.isInteger(degree)||degree<1||degree>7)throw new Error('調または音階度数が不正です。');
  const i=degree-1;
  const rootPc=(root+scale[i])%12;
  const thirdPc=(root+scale[(i+2)%7]+(i+2>=7?12:0))%12;
  const fifthPc=(root+scale[(i+4)%7]+(i+4>=7?12:0))%12;
  const thirdInterval=(thirdPc-rootPc+12)%12;
  const fifthInterval=(fifthPc-rootPc+12)%12;
  let quality='';
  if(thirdInterval===4&&fifthInterval===7)quality='';
  else if(thirdInterval===3&&fifthInterval===7)quality='m';
  else if(thirdInterval===3&&fifthInterval===6)quality='dim';
  else if(thirdInterval===4&&fifthInterval===8)quality='aug';
  else throw new Error('未対応の三和音構成です: '+key+' degree '+degree+' ('+thirdInterval+'/'+fifthInterval+')');
  return {degree,root:LYRIC_NOTE_NAMES[rootPc],quality,chord:LYRIC_NOTE_NAMES[rootPc]+quality,tones:[rootPc,thirdPc,fifthPc],intervals:[thirdInterval,fifthInterval]};
}
function parseChordProgressionText(raw){
  const source=String(raw||'').replace(/[，、；]/g,',').trim();
  if(!source)throw new Error('コード進行が空です。例：C, G, Am, F');
  const tokens=source.split(',').map(x=>x.trim()).filter(Boolean);
  if(tokens.length<1||tokens.length>64)throw new Error('コード数は1〜64個にしてください。');
  const pattern=/^([A-Ga-g])([#b]?)(maj7|maj9|mmaj7|m7b5|dim7|sus2|sus4|add9|maj|min|m|7|9|11|13|dim|aug|\+|°)?(\/[A-Ga-g][#b]?)?$/;
  return tokens.map((token,index)=>{
    const match=token.match(pattern);
    if(!match)throw new Error('「'+token+'」を読み取れません。例：C, G, Am, F');
    const root=match[1].toUpperCase()+match[2];
    return {id:'chord-'+String(index+1).padStart(3,'0'),bar:index+1,chord:root+(match[3]||'')+(match[4]||''),beats:4};
  });
}

async function copyChordText(text,successMessage){

    else{

      helper.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(helper);
      helper.select();helper.setSelectionRange(0,helper.value.length);
      const copied=document.execCommand('copy');document.body.removeChild(helper);

    }
    if(status)status.textContent=successMessage;
    return true;
  }catch(error){if(status)status.textContent='自動コピーできません。欄内を長押しして全選択・コピーしてください。';return false;}

function generateLyricMusicSketch(){

  });

let noteSequenceAudio = null;
let noteSequenceNodes = [];
function parseNoteSequenceText(raw) {
  const source=String(raw||'').replace(/[＊ｘＸ]/g,'×').replace(/[，、；]/g,',').trim();
  if(!source)throw new Error('音符列が空です。例：C4-4, E4-4, G4-4');
  const tokens=source.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
  const notes=[];
  for(const token of tokens){
    const m=token.match(/^([A-Ga-g]#?-?\d+)\s*(?:[-×xX*])\s*(\d+(?:\.\d+)?)$/);
    if(!m)throw new Error('「'+token+'」を読み取れません。C4-4 または C4×4 の形式で入力してください。');
    const note=m[1].toUpperCase(),length=Number(m[2]),midi=noteToMidi(note);
    if(!Number.isFinite(length)||length<=0||length>64)throw new Error('「'+token+'」の拍数は0より大きく64以下にしてください。');
    if(!Number.isFinite(midi))throw new Error('「'+note+'」は読み取れない音名です。');
    notes.push({note,length});
  }
  if(!notes.length)throw new Error('音符がありません。C4×4 の形式で貼り付けてください。');
  return notes;
}
function stopNoteSequence() {
  noteSequenceNodes.forEach(node => { try { node.stop(); } catch (_) {} });
  noteSequenceNodes = [];
  const status = document.getElementById('note-sequence-status');
  if (status) status.textContent = '停止しました。';
}
async function playNoteSequence() {
  stopNoteSequence();
  const status = document.getElementById('note-sequence-status');
  let notes;
  try { notes = parseNoteSequenceText(document.getElementById('note-sequence-input').value); }
  catch (e) { status.textContent = e.message; return; }
  const bpm = Math.max(40, Math.min(220, Number(document.getElementById('note-sequence-bpm').value) || 120));
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (!AudioCtx) { status.textContent = 'このブラウザはWeb Audioに対応していません。'; return; }
  if (!noteSequenceAudio || noteSequenceAudio.state === 'closed') noteSequenceAudio = new AudioCtx();
  await noteSequenceAudio.resume();
  const ctx = noteSequenceAudio;
  const beatSeconds = 60 / bpm;
  let at = ctx.currentTime + 0.08;
  notes.forEach(item => {
    const midi = noteToMidi(item.note);
    const frequency = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(frequency, at);
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.linearRampToValueAtTime(0.16, at + 0.015);
    gain.gain.setValueAtTime(0.16, Math.max(at + 0.02, at + item.length * beatSeconds - 0.04));
    gain.gain.linearRampToValueAtTime(0.0001, at + item.length * beatSeconds);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(at); osc.stop(at + item.length * beatSeconds + 0.02);
    noteSequenceNodes.push(osc);
    at += item.length * beatSeconds;
  });
  status.textContent = notes.length + '音を再生中（BPM ' + bpm + '）。再生時間 約' + Math.round(notes.reduce((s,n)=>s+n.length,0)*beatSeconds) + '秒';
  const totalMs = Math.ceil((at - ctx.currentTime) * 1000) + 150;
  window.setTimeout(() => {
    if (status && status.textContent.includes('再生中')) status.textContent = notes.length + '音の再生が終わりました。';
    noteSequenceNodes = [];
  }, totalMs);
}
function loadNoteSequenceToCanvas() {

function buildMelodyProject(sourceName) {
  const rhythmProject=window.__lastDrumProject||{};
  const preservedMelody=rhythmProject.melody;
  const cards=Array.isArray(state.lastNotes)?state.lastNotes:[];
  const byId=new Map(cards.filter(card=>card.id).map(card=>[card.id,card]));
  const melody=preservedMelody&&Array.isArray(preservedMelody.notes)&&preservedMelody.notes.length
    ? preservedMelody.notes.map((n,i)=>{
        const stableId=n.id||makeMelodyNoteId(i);
        const card=byId.get(stableId)||cards.find(item=>item.id===stableId);
        if(!card)return {...n,id:stableId};
        const editedPitch=noteToMidi(card.note);
        const editedDuration=Number(card.length)/4;
        return {
          ...n,id:stableId,
          pitch:Number.isFinite(editedPitch)?editedPitch:n.pitch,
          durationBeats:Number.isFinite(editedDuration)&&editedDuration>0?editedDuration:n.durationBeats,
          lyricId:card.lyricId||n.lyricId||null
        };
      })
    : [];
  if(!melody.length){
    let beat=0;
    cards.forEach((seg,i)=>{
      const duration=Number(seg.length)/4;
      melody.push({id:seg.id||makeMelodyNoteId(i),pitch:noteToMidi(seg.note),startBeat:Number.isFinite(Number(seg.startBeat))?Number(seg.startBeat):beat,durationBeats:duration,vel:90,lyricId:seg.lyricId||null});
      beat=melody[melody.length-1].startBeat+duration;
    });
  }

  return {
    version: "1.0",
    source: sourceName,
    name: window.__incomingLyricProject?.title||window.__incomingLyricProject?.name||("キャンバス曲 "+new Date().toLocaleDateString("ja-JP")),
    bpm: Number(rhythmProject.bpm)||Number(window.__incomingLyricProject?.bpm)||Number(document.getElementById('note-sequence-bpm')?.value)||120,
    timeSig: Number(rhythmProject.timeSig)||4,
    bars: Number(rhythmProject.bars)||undefined,
    div: Number(rhythmProject.div)||undefined,
    melody: { notes: melody },
    exported: new Date().toISOString()
  };
}

function normalizeCompositionValue(value){
  if(Array.isArray(value))return value.map(normalizeCompositionValue);
  if(!value||typeof value!=='object')return typeof value==='number'?Number(value.toFixed(4)):value;
  return Object.fromEntries(Object.keys(value).filter(k=>!['exported','updatedAt','createdAt'].includes(k)).sort().map(k=>[k,normalizeCompositionValue(value[k])]));
}
function createCompositionSnapshot(project){
  const melody=project.melody?.notes||[];
  const lyricNotes=project.lyricProject?.notes||[];
  return {
    projectId:project.lyricProject?.projectId||window.__musicProjectId||null,
    timeline:{bpm:Number(project.bpm)||120,timeSig:Number(project.timeSig)||4,bars:Number(project.bars)||2,div:Number(project.div)||16},
    melody:melody.map(n=>({id:n.id||null,pitch:n.pitch,startBeat:n.startBeat,durationBeats:n.durationBeats,lyricId:n.lyricId||null})).sort((a,b)=>String(a.id).localeCompare(String(b.id))),

    lyricAssignments:lyricNotes.map(n=>({id:n.id||null,lyricId:n.lyricId||null,lyric:n.lyric||'',role:n.role||'',section:n.section||''})).sort((a,b)=>String(a.id).localeCompare(String(b.id))),
    chords:normalizeCompositionValue(project.chords||project.generatedMusic?.chords||[])
  };
}
function compareCompositionSnapshot(baseline,project,options={}){
  if(!baseline)return {ok:false,errors:['比較元スナップショットがありません']};
  const current=createCompositionSnapshot(project),errors=[];
  const allowedChanges=new Set(options.allowedChanges||[]);
  const checked=['timeline','lyrics','melody','lyricAssignments','chords'];
  for(const key of checked){
    if(allowedChanges.has(key))continue;
    if(JSON.stringify(normalizeCompositionValue(baseline[key]))!==JSON.stringify(normalizeCompositionValue(current[key])))errors.push(key+' が保存前と一致しません');
  }
  return {ok:errors.length===0,errors,checked:checked.filter(key=>!allowedChanges.has(key)),allowedChanges:[...allowedChanges]};
}
function midiToNoteName(midi){
  const names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const n=Math.round(Number(midi));
  return names[((n%12)+12)%12]+(Math.floor(n/12)-1);
}

function restoreBeatLabProject(project){

  window.__lastDrumProject={bpm:project.bpm||120,timeSig:project.timeSig||4,bars:project.bars||2,div:project.div||16,drums:project.drums||{notes:[]},melody:project.melody||{notes:[]},rhythmVariations:project.rhythmVariations||[],arrangement:project.arrangement||null};
  saveLyricCanvasProject();
  if(typeof msRegister==='function')msRegister(project);
  showToast('メロディを保持したままドラムリズムを取り込みました（'+(project.drums?.notes?.length||0)+'打）');
  return true;
}

function sendToSheet() {
  if (!state.lastNotes || state.lastNotes.length === 0) {
    showToast("送信するメロディがありません");
    return;
  }
  msSheet(buildMelodyProject("composition-canvas"));
}

function sendToVocalLab() {
  if (!state.lastNotes || state.lastNotes.length === 0) {
    showToast("送信するメロディがありません");
    return;
  }
  // vocal-lab側のnormalizeImportedCards()には
  // {source, melody:{notes:[{pitch,startBeat,durationBeats,vel}]}}形式を
  // フレーズカードへ自動変換する専用ロジックが既にあるため、
  // score-editor向けと全く同じペイロードをそのまま送れる。
  const project = buildMelodyProject("composition-canvas");
  try { msRegister(project); } catch(e) {}
  window.location.href = "vocal-lab-v3.html#import=" + encodeForImport(project);
}
/* ───────────────────────────────
   ページ読み込み時
────────────────────────────── */
window.addEventListener('load',()=>{
  let restored=false;
  try{restored=parseIncomingLyrics()===true;}catch(e){console.warn('incoming project restore failed',e);}
  if(!restored){
    try{
      const savedLyric=JSON.parse(localStorage.getItem('compositionLyricProject')||'null');
      if(savedLyric&&restoreLyricCanvasProject(savedLyric))restored=true;
    }catch(e){console.warn('saved lyric project restore failed',e);}
  }
  if(!restored)loadCardPositions();
  const input=document.getElementById('note-sequence-input');
  if(input){input.addEventListener('input',()=>{const status=document.getElementById('note-sequence-status');if(status)status.textContent='入力中です。「音符カードに読み込む」を押すとカードになります。';});}
});

function showToast(msg) {
  console.log(msg);
}
</script>

<script>
/* ── music-suite 連携：曲の一覧（msuite_projects / msuite_works）の登録・クラウド同期（マージ方式）──
   ・同じ名前＋同じ種類の曲は上書き登録（増えません）
   ・同期は「合体」：新しい方を残し、削除した曲は戻りません（上書きで消えることはありません） */
var MS_P='msuite_projects',MS_W='msuite_works',MS_D='msuite_deleted',MS_EP='msuite_sync_endpoint',MS_TK='msuite_sync_token',MS_LAST='msuite_last_sync';
function msJ(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function msSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function msSrc(p){return p.source||(p.cards?'vocal-lab':(p.melody||p.bass)?'score-editor':p.chords?'chord-lab':p.drums?'beat-lab':'unknown')}
function msKeyP(p){return p.projectId?'id:'+p.projectId:'p:'+msSrc(p)+'\u0001'+(p.name||p.projectName||'無題')}
function msTs(p){return Date.parse(p&&(p.updatedAt||p.exported||p.createdAt))||0}
function msTomb(key){var d=msJ(MS_D,{});d[key]=Date.now();msSet(MS_D,d);if(typeof msSyncSoon==='function')msSyncSoon()}
function msRegister(d){try{if(!d||typeof d!=='object'||Array.isArray(d))return;var a=msJ(MS_P,[]);if(!Array.isArray(a))a=[];
  var nm=d.name||d.projectName||'無題',src=d.source||'unknown',j=Object.assign({},d,{name:nm,source:src,updatedAt:new Date().toISOString()});
  var i=a.findIndex(function(x){return (x.name||x.projectName||'無題')===nm&&msSrc(x)===src});if(i>=0)a[i]=j;else a.push(j);msSet(MS_P,a);msSyncSoon()}catch(e){}}
function msSheet(d){if(!d)return;msRegister(d);var u=location.origin+'/lead-sheet/#import='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));if(u.length>60000){alert('曲が大きすぎて、リンクで送れません。JSONで渡してください');return}location.href=u}
function msMerge(L,R){
  var dead=Object.assign({},R.deleted||{});var ld=L.deleted||{};Object.keys(ld).forEach(function(k){dead[k]=Math.max(dead[k]||0,ld[k])});
  var map={};(R.projects||[]).concat(L.projects||[]).forEach(function(p){if(!p||typeof p!=='object')return;var k=msKeyP(p),o=map[k];if(!o||msTs(p)>=msTs(o))map[k]=p});
  var projects=Object.keys(map).filter(function(k){return !(dead[k]&&dead[k]>=msTs(map[k]))}).map(function(k){return map[k]});
  var wm={};(R.works||[]).concat(L.works||[]).forEach(function(w){if(!w||!w.id)return;var o=wm[w.id];
    if(!o){wm[w.id]=Object.assign({},w);return}
    var nw=(Date.parse(w.updatedAt||w.createdAt)||0)>=(Date.parse(o.updatedAt||o.createdAt)||0)?w:o;var m=Object.assign({},nw);
    var seen={},secs=[];(o.sections||[]).concat(w.sections||[]).forEach(function(s){var k=s.type+'\u0001'+s.label;if(!seen[k]){seen[k]=1;secs.push(s)}});m.sections=secs;wm[w.id]=m});
  var works=Object.keys(wm).filter(function(id){var t=dead['w:'+id];return !(t&&t>=(Date.parse(wm[id].createdAt)||0))}).map(function(id){return wm[id]});
  return{works:works,projects:projects,deleted:dead}}
var msBusy=false,msTimer=null;
function msCfg(){var ep=(localStorage.getItem(MS_EP)||'').trim().replace(/\/$/,''),tk=(localStorage.getItem(MS_TK)||'').trim();return ep&&tk?{ep:ep,tk:tk}:null}
async function msSyncNow(){var c=msCfg();if(!c)return{ok:false,msg:'同期の設定がありません'};if(msBusy)return{ok:false,msg:'同期中です'};msBusy=true;
  try{var au={Authorization:'Bearer '+c.tk},r=await fetch(c.ep+'/sync/music-suite',{headers:au});
    if(r.status===401||r.status===403)throw new Error('トークンが違います('+r.status+')');
    var remote={works:[],projects:[],deleted:{}};
    if(r.status!==404){if(!r.ok)throw new Error('受信に失敗('+r.status+')');var j=await r.json();if(j&&j.data){remote={works:j.data.works||[],projects:j.data.projects||[],deleted:j.data.deleted||{}}}}
    var local={works:msJ(MS_W,[]),projects:msJ(MS_P,[]),deleted:msJ(MS_D,{})};
    var m=msMerge(local,remote);msSet(MS_W,m.works);msSet(MS_P,m.projects);msSet(MS_D,m.deleted);
    var same=JSON.stringify(msMerge(remote,remote))===JSON.stringify(m);
    if(!same||r.status===404){var pr=await fetch(c.ep+'/sync/music-suite',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},au),body:JSON.stringify({data:m})});if(!pr.ok)throw new Error('送信に失敗('+pr.status+')')}
    localStorage.setItem(MS_LAST,String(Date.now()));return{ok:true,works:m.works.length,projects:m.projects.length}}
  catch(e){return{ok:false,msg:String(e&&e.message||e)}}finally{msBusy=false}}
function msSyncSoon(){if(!msCfg())return;clearTimeout(msTimer);msTimer=setTimeout(function(){msSyncNow().then(function(r){if(typeof msAfterSync==='function')msAfterSync(r)})},1500)}
</script>
