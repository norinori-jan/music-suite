<title>ひらめき（作曲補助）</title>
<style>

<div class="card">

  </div>

    <input type="range" id="bpm" min="60" max="160" value="100"></div>
</div>

<button id="hero">🎲 ひらめかせる！</button>
<div class="row" style="margin-bottom:6px"><button class="sm" id="bPrompt">🎁 お題をもらう</button><span id="prompt"></span></div>

<div class="card recent" id="recent" hidden></div>

<script>

   ・同期は「合体」：新しい方を残し、削除した曲は戻りません（上書きで消えることはありません） */
var MS_P='msuite_projects',MS_W='msuite_works',MS_D='msuite_deleted',MS_EP='msuite_sync_endpoint',MS_TK='msuite_sync_token',MS_LAST='msuite_last_sync';

function msSrc(p){return p.source||(p.cards?'vocal-lab':(p.melody||p.bass)?'score-editor':p.chords?'chord-lab':p.drums?'beat-lab':'unknown')}
function msKeyP(p){return 'p:'+msSrc(p)+'\u0001'+(p.name||p.projectName||'無題')}
function msTs(p){return Date.parse(p&&(p.updatedAt||p.exported||p.createdAt))||0}

  var i=a.findIndex(function(x){return (x.name||x.projectName||'無題')===nm&&msSrc(x)===src});if(i>=0)a[i]=j;else a.push(j);msSet(MS_P,a);msSyncSoon()}catch(e){}}

function msMerge(L,R){
  var dead=Object.assign({},R.deleted||{});var ld=L.deleted||{};Object.keys(ld).forEach(function(k){dead[k]=Math.max(dead[k]||0,ld[k])});
  var map={};(R.projects||[]).concat(L.projects||[]).forEach(function(p){if(!p||typeof p!=='object')return;var k=msKeyP(p),o=map[k];if(!o||msTs(p)>=msTs(o))map[k]=p});
  var projects=Object.keys(map).filter(function(k){return !(dead[k]&&dead[k]>=msTs(map[k]))}).map(function(k){return map[k]});
  var wm={};(R.works||[]).concat(L.works||[]).forEach(function(w){if(!w||!w.id)return;var o=wm[w.id];
    if(!o){wm[w.id]=Object.assign({},w);return}
    var nw=(Date.parse(w.updatedAt||w.createdAt)||0)>=(Date.parse(o.updatedAt||o.createdAt)||0)?w:o;var m=Object.assign({},nw);
    var seen={},secs=[];(o.sections||[]).concat(w.sections||[]).forEach(function(s){var k=s.type+'\u0001'+s.label;if(!seen[k]){seen[k]=1;secs.push(s)}});m.sections=secs;wm[w.id]=m});
  var works=Object.keys(wm).filter(function(id){var t=dead['w:'+id];return !(t&&t>=(Date.parse(wm[id].createdAt)||0))}).map(function(id){return wm[id]});
  return{works:works,projects:projects,deleted:dead}}
var msBusy=false,msTimer=null;
function msCfg(){var ep=(localStorage.getItem(MS_EP)||'').trim().replace(/\/$/,''),tk=(localStorage.getItem(MS_TK)||'').trim();return ep&&tk?{ep:ep,tk:tk}:null}
async function msSyncNow(){var c=msCfg();if(!c)return{ok:false,msg:'同期の設定がありません'};if(msBusy)return{ok:false,msg:'同期中です'};msBusy=true;
  try{var au={Authorization:'Bearer '+c.tk},r=await fetch(c.ep+'/sync/music-suite',{headers:au});
    if(r.status===401||r.status===403)throw new Error('トークンが違います('+r.status+')');
    var remote={works:[],projects:[],deleted:{}};
    if(r.status!==404){if(!r.ok)throw new Error('受信に失敗('+r.status+')');var j=await r.json();if(j&&j.data){remote={works:j.data.works||[],projects:j.data.projects||[],deleted:j.data.deleted||{}}}}
    var local={works:msJ(MS_W,[]),projects:msJ(MS_P,[]),deleted:msJ(MS_D,{})};
    var m=msMerge(local,remote);msSet(MS_W,m.works);msSet(MS_P,m.projects);msSet(MS_D,m.deleted);
    var same=JSON.stringify(msMerge(remote,remote))===JSON.stringify(m);
    if(!same||r.status===404){var pr=await fetch(c.ep+'/sync/music-suite',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},au),body:JSON.stringify({data:m})});if(!pr.ok)throw new Error('送信に失敗('+pr.status+')')}

  catch(e){return{ok:false,msg:String(e&&e.message||e)}}finally{msBusy=false}}
function msSyncSoon(){if(!msCfg())return;clearTimeout(msTimer);msTimer=setTimeout(function(){msSyncNow().then(function(r){if(typeof msAfterSync==='function')msAfterSync(r)})},1500)}
</script>

    for(let i=0;i<rhy.length;i++){const d=rhy[i];if(d<0){t+=-d;continue}
      const beatInBar=t-bar*4,strong=(beatInBar%2===0)||d>=1.5,last=(bar===n-1&&i===rhy.length-1);
      const cs=cand(c,strong);let best=null,bw=-1;
      // 2小節目・6小節目は1小節目の動きをなぞる（モチーフの反復）
      let want=null;if((bar===1||bar===5)&&motif&&motif.iv.length>i&&prev!=null)want=prev+motif.iv[i];
      for(const k of cs){let w=1;const dist=prev==null?Math.abs(k.m-target):Math.abs(k.m-prev);
        w*=Math.exp(-(dist*dist)/(2*3.6*3.6));if(prev!=null&&dist===0)w*=.55;if(prev!=null&&dist>7)w*=.2;
        if(strong)w*=k.ct?3.2:.35;else w*=k.ct?1.2:1;
        w*=Math.exp(-((k.m-target)*(k.m-target))/(2*5.5*5.5));
        if(last){w*=k.ct?4:.05;const root=(c.r===k.m%12);if(root)w*=2.5}
        if(want!=null)w*=1+3*Math.exp(-((k.m-want)*(k.m-want))/2);
        if(notes.length>=2&&notes[notes.length-1].p===k.m&&notes[notes.length-2].p===k.m)w*=.05;
        w*=.6+r()*.8;if(w>bw){bw=w;best=k}}
      const p=best.m;notes.push({p,t,d:last?Math.max(.5,Math.min(Math.max(d,2),n*4-t)):d,ct:best.ct});if(bar===0&&!first)motif.iv.push(p-prev);else if(bar===0)motif.iv.push(0);first=false;prev=p;t+=d}
    if(bar===0){motif.iv=motif.iv.slice();}
  }
  return notes}
// ===== 生成 =====
function newSeed(){return(Math.random()*1679615|0)+1}
function genAll(keepChords){const m=MOODS[S.mood];S.seed=newSeed();
  if(!keepChords){const r=rngOf(S.seed);S.tpl=rint(r,m.tpl.length);S.chords=buildChords(S.tpl,r)}
  if(!S.lockMel||!S.mel.length)S.mel=genMelody(S.chords,m.mode,S.seed);
  S.sel=-1;autoTitle();render()}
function autoTitle(){const m=MOODS[S.mood],k=chordName({r:S.key,q:m.mode==='minor'||m.mode==='dorian'?'m':''},S.key,m.mode);S.title=(S.prompt?S.prompt+'・':'')+m.label.replace(/^\S+\s*/,'')+' '+k+' '+seedStr(S.seed)}
// ===== 表示 =====
function render(){if(!S.chords.length)return;const m=MOODS[S.mood];$('res').hidden=false;$('title').value=S.title;$('seed').textContent='ひらめきコード '+seedStr(S.seed);
  $('chords').innerHTML=S.chords.map((c,i)=>'<div class="ch'+(i===S.sel?' sel':'')+'" data-i="'+i+'"><b>'+esc(chordName(c,S.key,m.mode))+'</b><span>'+esc(romanOf(c.sem,c.q))+'</span></div>').join('');
  const total=S.chords.length*4;let h='';for(let b=1;b<S.chords.length;b++)h+='<div class="bar'+(b%4===0?' b4':'')+'" style="left:'+(b*4/total*100)+'%"></div>';
  const lo=Math.min(...S.mel.map(n=>n.p))-1,hi=Math.max(...S.mel.map(n=>n.p))+1,span=Math.max(12,hi-lo);
  S.mel.forEach((n,i)=>{h+='<div class="n'+(n.ct?' ct':'')+'" data-n="'+i+'" style="left:'+(n.t/total*100)+'%;width:calc('+(n.d/total*100)+'% - 2px);top:'+((hi-n.p)/span*112+8)+'px;animation-delay:'+(i*18)+'ms"></div>'});
  $('roll').innerHTML='<div id="ph"></div>'+h;
  const t=m.tpl[S.tpl];$('why').innerHTML='🎼 <b>この進行について</b>：'+esc(t.why)+'<br>🎵 <b>メロディのコツ</b>：緑の音（コードの音）を、強い拍に置いています。1小節目の動きを2小節目で繰り返して、最後は長い音で落ち着かせています。';
  $('lock').textContent=S.lockMel?'🔒 メロディ固定中':'🔓 メロディ固定しない';$('lock').className='sm'+(S.lockMel?' on':'');
  showAlt();drawRecent();drawStreak()}
function showAlt(){const el=$('alt');if(S.sel<0){el.hidden=true;return}const c=S.chords[S.sel],m=MOODS[S.mood];el.hidden=false;
  const flav={'':['maj7','sus4','7'],m:['m7'],'7':['','sus4'],maj7:['','sus4'],m7:['m'],sus4:['','7']}[c.q]||[];
  const dia=(m.mode==='minor'||m.mode==='dorian')?[[0,'m'],[3,''],[5,m.mode==='dorian'?'':'m'],[7,'7'],[8,''],[10,'']]:[[0,''],[2,'m'],[4,'m'],[5,''],[7,''],[9,'m']];
  let h='<b>'+(S.sel+1)+'つ目のコードを変える</b><br><span style="color:var(--dim)">味つけ（同じ音の仲間）</span><br>';
  h+=flav.map(q=>'<button class="sm" data-q="'+q+'">'+esc(chordName({r:c.r,q},S.key,m.mode))+'</button>').join('');
  h+='<br><span style="color:var(--dim)">ほかのコード</span><br>';
  h+=dia.filter(([s,q])=>!(((S.key+s)%12)===c.r&&q===c.q)).map(([s,q])=>'<button class="sm" data-s="'+s+'" data-q="'+q+'">'+esc(chordName({r:(S.key+s)%12,q},S.key,m.mode))+' <span style="color:var(--dim)">'+esc(romanOf(s,q))+'</span></button>').join('');
  el.innerHTML=h}
$('chords').onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const i=+d.dataset.i;S.sel=S.sel===i?-1:i;render()};
$('alt').onclick=e=>{const b=e.target.closest('button');if(!b||S.sel<0)return;const c=S.chords[S.sel],m=MOODS[S.mood];
  if(b.dataset.s!=null){S.chords[S.sel]=mkChord(S.key,+b.dataset.s,b.dataset.q,m.mode)}else{c.q=b.dataset.q}
  if(!S.lockMel)S.mel=genMelody(S.chords,m.mode,S.seed);render()};
// ===== 音を鳴らす =====
let ac=null,master=null,playing=false,raf=0,t0=0,endT=0,timers=[];
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function tone(t,m,dur,type,vol,att,rel,lp){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=mtof(m);
  let dest=master;if(lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;g.connect(f);f.connect(master)}else g.connect(master);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.setTargetAtTime(vol*.55,t+att,.25);g.gain.setTargetAtTime(0,t+dur,rel);o.connect(g);o.start(t);o.stop(t+dur+rel*6+.05)}
function voicing(c,prevMid){const pcs=QS[c.q].map(x=>(c.r+x)%12),out=[];pcs.forEach(pc=>{let best=null;for(let m=52;m<=72;m++)if(m%12===pc&&(best==null||Math.abs(m-prevMid)<Math.abs(best-prevMid)))best=m;out.push(best)});return out.sort((a,b)=>a-b)}
function startPlay(){if(!S.chords.length)return;if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  stopPlay(true);master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
  const spb=60/S.bpm,t=ac.currentTime+.12;t0=t;endT=t+S.chords.length*4*spb;let mid=62;
  S.chords.forEach((c,i)=>{const bt=t+i*4*spb,vs=voicing(c,mid);mid=vs.reduce((a,b)=>a+b,0)/vs.length;
    vs.forEach((m,k)=>tone(bt+k*.025,m,3.8*spb,'triangle',.07,.05,.25,1600));tone(bt,36+c.r,1.8*spb,'sine',.2,.01,.12,500);tone(bt+2*spb,36+c.r+(QS[c.q][2]===7?7:0),1.6*spb,'sine',.13,.01,.12,500)});
  S.mel.forEach(n=>{const nt=t+n.t*spb,d=n.d*spb*.92;tone(nt,n.p,d,'triangle',.16,.006,.09);tone(nt,n.p+12,d*.5,'sine',.035,.004,.06)});
  playing=true;$('play').textContent='■ 止める';$('ph').style.display='block';anim();
  timers.push(setTimeout(()=>{if($('loop').checked&&playing)startPlay();else stopPlay()},(endT-ac.currentTime)*1000+250))}
function stopPlay(quiet){timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);if(master){try{master.gain.setTargetAtTime(0,ac.currentTime,.02);const mm=master;setTimeout(()=>{try{mm.disconnect()}catch(e){}},300)}catch(e){}master=null}
  playing=false;$('play').textContent='▶ 聴く';const ph=$('ph');if(ph)ph.style.display='none';document.querySelectorAll('.ch.now,.n.now').forEach(x=>x.classList.remove('now'))}
function anim(){if(!playing)return;const spb=60/S.bpm,pos=(ac.currentTime-t0)/spb,total=S.chords.length*4;
  if(pos>=0){const ph=$('ph');if(ph){ph.style.left=(pos/total*100)+'%';ph.style.display='block'}const bi=Math.min(S.chords.length-1,Math.floor(pos/4));
    document.querySelectorAll('.ch').forEach((x,i)=>x.classList.toggle('now',i===bi));
    document.querySelectorAll('#roll .n').forEach((x,i)=>{const n=S.mel[i];x.classList.toggle('now',n&&pos>=n.t&&pos<n.t+n.d)})}
  raf=requestAnimationFrame(anim)}
$('play').onclick=()=>playing?stopPlay():startPlay();
// ===== 出力・保存 =====
function keyLabel(){const m=MOODS[S.mood];return chordName({r:S.key,q:(m.mode==='minor'||m.mode==='dorian')?'m':''},S.key,m.mode)}
function payload(){const m=MOODS[S.mood],name=($('title').value||S.title||'ひらめき').trim();S.title=name;
  return{version:'1.0',source:'compose-spark',name,bpm:S.bpm,key:keyLabel(),timeSig:4,
   melody:{notes:S.mel.map(n=>({pitch:n.p,startBeat:n.t,durationBeats:n.d,vel:90}))},
   chords:{key:keyLabel(),sections:[{tag:'ひらめき',progression:S.chords.map(c=>({chord:chordName(c,S.key,m.mode),beats:4}))}]},
   bass:{notes:S.chords.map((c,i)=>({pitch:36+c.r,startBeat:i*4,durationBeats:4,vel:80}))},drums:{notes:[]},
   spark:{mood:S.mood,key:S.key,bars:S.bars,bpm:S.bpm,seed:S.seed,tpl:S.tpl,prompt:S.prompt,lock:S.lockMel,chords:S.chords.map(c=>({sem:c.sem,r:c.r,q:c.q})),mel:S.mel.map(n=>({p:n.p,t:n.t,d:n.d,ct:n.ct?1:0}))},exported:new Date().toISOString()}}
function say(m){$('msg').textContent=m;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',3500)}
function markDay(){try{const a=JSON.parse(localStorage.getItem('cs_days')||'[]'),d=new Date().toISOString().slice(0,10);if(!a.includes(d)){a.push(d);localStorage.setItem('cs_days',JSON.stringify(a.slice(-400)))}}catch(e){}}
function streak(){try{const a=new Set(JSON.parse(localStorage.getItem('cs_days')||'[]'));let n=0;const d=new Date();if(!a.has(d.toISOString().slice(0,10)))d.setDate(d.getDate()-1);while(a.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}catch(e){return 0}}
function drawStreak(){const n=streak();$('streak').textContent=n>0?'🔥 '+n+'日連続':'✨ 今日の1曲';}
$('save').onclick=()=>{msRegister(payload());markDay();drawStreak();drawRecent();say('♥ 保存しました。music-suite の曲一覧に入ります（同期の設定があれば、他の端末にも届きます）')};
$('toSheet').onclick=()=>{markDay();msSheet(payload())};
$('toScore').onclick=()=>{const p=payload();msRegister(p);markDay();const u=location.origin+'/music-suite/apps/score-editor-v2.html#import='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p)))));location.href=u};
$('toChord').onclick=()=>{const p=payload();msRegister(p);markDay();const u=location.origin+'/music-suite/apps/chord-lab.html#import='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p)))));location.href=u};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(payload()));say('JSONをコピーしました')}catch(e){say('コピーできませんでした')}};
$('title').oninput=()=>{S.title=$('title').value};
// ===== 操作 =====
const moodsEl=$('moods');moodsEl.innerHTML=Object.keys(MOODS).map(k=>'<button data-m="'+k+'" class="'+(k===S.mood?'on':'')+'">'+MOODS[k].label+'</button>').join('');
function pickMood(k){S.mood=k;S.bpm=MOODS[k].bpm;$('bpm').value=S.bpm;$('bpmV').textContent=S.bpm;moodsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===k))}
moodsEl.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;pickMood(b.dataset.m);S.prompt='';if(S.chords.length){S.mel=[];genAll(false)}};
$('key').innerHTML='<option value="-1">キー：おまかせ</option>'+SH.map((n,i)=>'<option value="'+i+'">キー '+(useFlat(i,'major')?FL[i]:n)+'</option>').join('');
$('b4').onclick=()=>setBars(4);$('b8').onclick=()=>setBars(8);
function setBars(n){S.bars=n;$('b4').className=n===4?'on':'';$('b8').className=n===8?'on':'';if(S.chords.length){S.mel=[];genAll(false)}}
$('bpm').oninput=()=>{S.bpm=+$('bpm').value;$('bpmV').textContent=S.bpm;if(playing)startPlay()};
function chooseKey(){const v=+$('key').value;S.key=v<0?rint(Math.random,12):v}
$('hero').onclick=()=>{const h=$('hero');h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');stopPlay();chooseKey();S.prompt=S.prompt;S.mel=[];genAll(false);markDay();drawStreak();setTimeout(()=>startPlay(),60)};
$('bPrompt').onclick=()=>{const k=pickOf(Math.random,Object.keys(MOODS));pickMood(k);S.prompt=pickOf(Math.random,PROMPTS);$('prompt').textContent='🎁 お題：「'+S.prompt+'」';stopPlay();chooseKey();S.mel=[];genAll(false);markDay();drawStreak();setTimeout(()=>startPlay(),60)};
$('reMel').onclick=()=>{stopPlay();S.seed=newSeed();S.mel=genMelody(S.chords,MOODS[S.mood].mode,S.seed);S.sel=-1;autoTitle();render();setTimeout(()=>startPlay(),60)};
$('reCh').onclick=()=>{stopPlay();const m=MOODS[S.mood],r=rngOf(newSeed());S.tpl=(S.tpl+1+rint(r,m.tpl.length-1))%m.tpl.length;S.chords=buildChords(S.tpl,r);if(!S.lockMel)S.mel=genMelody(S.chords,m.mode,S.seed);S.sel=-1;render();setTimeout(()=>startPlay(),60)};
$('lock').onclick=()=>{S.lockMel=!S.lockMel;render()};
// ===== 保存した曲 =====
function drawRecent(){let a=[];try{a=JSON.parse(localStorage.getItem('msuite_projects')||'[]').map((p,i)=>({p,i})).filter(x=>x.p&&x.p.source==='compose-spark'&&x.p.spark)}catch(e){}
  const el=$('recent');if(!a.length){el.hidden=true;return}el.hidden=false;el.innerHTML='<h4>♥ 保存したひらめき（タップで続きから）</h4>'+a.slice(-12).reverse().map(x=>'<button class="sm" data-p="'+x.i+'">'+esc(x.p.name)+'</button>').join('')}
$('recent').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;try{const p=JSON.parse(localStorage.getItem('msuite_projects'))[+b.dataset.p];if(p)load(p)}catch(e){}};
// ===== 読み込み（保存した曲・music-suite から）=====
function parseChordName(n){const m=String(n).replace(/♯/g,'#').replace(/♭/g,'b').match(/^([A-G])([#b]?)(maj7|m7|sus4|7|m)?/);if(!m)return null;const pc={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);return{r:(pc+12)%12,q:m[3]||''}}
function load(p){try{stopPlay();const sp=p.spark;
  if(sp&&sp.chords&&sp.mel){const mood=MOODS[sp.mood]?sp.mood:'bright';pickMood(mood);S.key=sp.key;S.bars=sp.bars||sp.chords.length;S.bpm=sp.bpm||MOODS[mood].bpm;$('bpm').value=S.bpm;$('bpmV').textContent=S.bpm;S.seed=sp.seed||1;S.tpl=sp.tpl||0;S.prompt=sp.prompt||'';S.lockMel=!!sp.lock;
    S.chords=sp.chords.map(c=>({r:c.r,q:c.q,sem:c.sem}));S.mel=sp.mel.map(n=>({p:n.p,t:n.t,d:n.d,ct:!!n.ct}));$('b4').className=S.bars===4?'on':'';$('b8').className=S.bars===8?'on':'';
    if(S.prompt)$('prompt').textContent='🎁 お題：「'+S.prompt+'」';S.title=p.name||'';S.sel=-1;render();return true}
  // 他のアプリの曲（コードとメロディ）から
  const secs=(p.chords&&p.chords.sections)||[];const list=[];secs.forEach(s=>(s.progression||[]).forEach(c=>{const x=parseChordName(c.chord||c.name);if(x)list.push(x)}));
  if(!list.length)return false;const mood='bright';pickMood(mood);S.key=list[0].r;S.chords=list.slice(0,8).map(c=>({r:c.r,q:c.q,sem:(c.r-S.key+12)%12}));S.bars=S.chords.length>4?8:4;
  S.mel=genMelody(S.chords,MOODS[mood].mode,S.seed=newSeed());S.title=(p.name||'取り込み')+'（メロディ案）';render();return true}catch(e){return false}}
(function boot(){const m=location.hash.match(/import=([^&]+)/);
  if(m){try{const p=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));history.replaceState(null,'',location.pathname);if(load(p))say('受け取りました')}catch(e){}}
  drawStreak();drawRecent();pickMood('bright');if(window.msCfg&&msCfg())msSyncNow().then(()=>drawRecent());
  window.msAfterSync=function(){drawRecent()}})();
window.__cs={S:()=>S,genMelody,buildChords,payload,load};
})();
