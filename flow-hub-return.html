<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>flow-hubへ戻る</title><style>body{margin:0;background:#0a0a0d;color:#eeedf8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;margin:20px;padding:28px;border:1px solid #292936;border-radius:18px;background:#121217;text-align:center}button,a{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:10px;border:1px solid #7f77dd;background:#7f77dd;color:#fff;text-decoration:none;font:inherit;cursor:pointer}.sub{color:#8886a0;font-size:13px;margin-top:8px}</style></head><body><main class="box"><div style="font-size:36px">🧭</div><h1>music-suiteを終了</h1><div class="sub">制作内容はmusic-suite側に残したまま、flow-hubへ戻ります。</div><a id="back" href="#">← flow-hubへ戻る</a></main><script>const h={protocol:'hub_handoff_v1',id:crypto.randomUUID(),createdAt:new Date().toISOString(),source:'music-suite',sourceRef:null,intent:'music.review',context:{text:'music-suiteで制作を完了',tags:['music'],emotion:null,focus:null},payload:{stage:'produce',status:'completed'},next:{app:'flow-hub',action:'review'},returnTo:'https://norinori-jan.github.io/flow-hub/'};const target='https://norinori-jan.github.io/flow-hub/#hub_handoff_v1='+encodeURIComponent(JSON.stringify(h));document.getElementById('back').href=target;document.getElementById('back').addEventListener('click',()=>{try{sessionStorage.setItem('hub_return_sent','1')}catch(e){}});</script></body></html>
